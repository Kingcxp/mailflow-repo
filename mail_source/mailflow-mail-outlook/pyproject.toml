[project]
name = "mailflow-mail-outlook"
version = "0.1.0"
description = "IMAP/SMTP mail source for Outlook/Office 365 with app-password auth"
requires-python = ">=3.11"
dependencies = ["mailflow-core", "mailflow-mail-imap @ git+https://github.com/Kingcxp/mailflow-repo.git#subdirectory=mail_source/mailflow-mail-imap"]

[project.entry-points."mailflow.plugins"]
mailflow-mail-outlook = "mailflow_mail_outlook.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_mail_outlook"]

[tool.hatch.metadata]
allow-direct-references = true
