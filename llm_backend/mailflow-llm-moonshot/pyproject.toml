[project]
name = "mailflow-llm-moonshot"
version = "0.1.0"
description = "Waymark Mail LLM backend: Moonshot AI (OpenAI-compatible chat completions)"
requires-python = ">=3.11"
dependencies = ["mailflow-core", "mailflow-llm-openai-compatible @ git+https://github.com/Kingcxp/waymark-mail-repo.git#subdirectory=llm_backend/mailflow-llm-openai-compatible"]

[project.entry-points."mailflow.plugins"]
mailflow-llm-moonshot = "mailflow_llm_moonshot.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_llm_moonshot"]

[tool.hatch.metadata]
allow-direct-references = true
