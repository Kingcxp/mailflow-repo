[project]
name = "mailflow-processor-blocklist"
version = "0.1.0"
description = "MailFlow blocklist processor: mark blocked senders/domains as junk"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-processor-blocklist = "mailflow_processor_blocklist.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_processor_blocklist"]
