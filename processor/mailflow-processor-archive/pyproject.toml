[project]
name = "mailflow-processor-archive"
version = "0.1.0"
description = "Flags mail from matching senders/domains as info + auto-archived"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-processor-archive = "mailflow_processor_archive.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_processor_archive"]
