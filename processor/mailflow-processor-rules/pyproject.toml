[project]
name = "mailflow-processor-rules"
version = "0.1.0"
description = "Applies the first matching rule template to each mail"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-processor-rules = "mailflow_processor_rules.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_processor_rules"]
