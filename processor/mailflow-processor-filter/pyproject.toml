[project]
name = "mailflow-processor-filter"
version = "0.1.0"
description = "Marks mail matching sender/subject/keyword rules as junk (gray)"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-processor-filter = "mailflow_processor_filter.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_processor_filter"]
