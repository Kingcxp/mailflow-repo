name: validate-plugins

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Check out the matching core and shared validator
        uses: actions/checkout@v5
        with:
          repository: Kingcxp/waymark-mail
          ref: ${{ (github.base_ref || github.ref_name) == 'dev' && 'dev' || 'main' }}
          path: _mailflow

      # plugin.json is the single source of truth for a plugin's description:
      # the marketplace renders it in `plugin market show` and in the TUI. The
      # per-folder README.md is generated from it, so a PR that edits one but
      # not the other must fail here rather than ship two different texts.
      - name: Check plugin READMEs match plugin.json
        run: python tools/gen_plugin_readmes.py --check

      - name: Test validator isolation and change selection
        run: python -m unittest discover -s tests

      # PRs: validate exactly the plugins this PR touched, so untouched
      # plugins are never re-tested. Branch pushes run a full sweep.
      - name: Validate changed plugins (pull requests)
        if: github.event_name == 'pull_request'
        env:
          PLUGIN_BASE_REF: origin/${{ github.base_ref }}
        run: python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable, 'tools/validate_plugin.py', '--changed', '--base', os.environ['PLUGIN_BASE_REF'], '--core', '_mailflow/packages/mailflow-core']))"

      - name: Validate all plugins (branch push)
        if: github.event_name == 'push'
        run: python tools/validate_plugin.py --all --core _mailflow/packages/mailflow-core
