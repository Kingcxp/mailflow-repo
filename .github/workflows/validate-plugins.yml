name: validate-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # plugin.json is the single source of truth for a plugin's description:
      # the marketplace renders it in `plugin market show` and in the TUI. The
      # per-folder README.md is generated from it, so a PR that edits one but
      # not the other must fail here rather than ship two different texts.
      - name: Check plugin READMEs match plugin.json
        run: python tools/gen_plugin_readmes.py --check

      # PRs: validate exactly the plugins this PR touched, so untouched
      # plugins are never re-tested. Pushes to main: full sweep.
      - name: Validate changed plugins (pull requests)
        if: github.event_name == 'pull_request'
        run: python tools/validate_plugin.py --changed

      - name: Validate all plugins (main)
        if: github.event_name == 'push'
        run: python tools/validate_plugin.py --all
