[project]
name = "mailflow-notify-smtp"
version = "0.1.0"
description = "MailFlow SMTP notifier: forward mail alerts via any SMTP server"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-smtp = "mailflow_notify_smtp.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_smtp"]
