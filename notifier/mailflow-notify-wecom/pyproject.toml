[project]
name = "mailflow-notify-wecom"
version = "0.1.0"
description = "Push mail alerts to a WeCom group-robot webhook"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-wecom = "mailflow_notify_wecom.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_wecom"]
