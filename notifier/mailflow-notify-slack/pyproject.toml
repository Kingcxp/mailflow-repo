[project]
name = "mailflow-notify-slack"
version = "0.1.0"
description = "Push mail alerts to a Slack incoming webhook"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-slack = "mailflow_notify_slack.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_slack"]
