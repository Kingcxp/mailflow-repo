[project]
name = "mailflow-notify-ntfy"
version = "0.1.0"
description = "MailFlow ntfy notifier: push mail alerts to ntfy topics"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-ntfy = "mailflow_notify_ntfy.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_ntfy"]
