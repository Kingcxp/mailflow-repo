[project]
name = "mailflow-notify-webhook"
version = "0.1.0"
description = "MailFlow webhook notifier: POST computed analyses to an HTTP endpoint"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-webhook = "mailflow_notify_webhook.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_webhook"]
