[project]
name = "mailflow-notify-serverchan"
version = "0.1.0"
description = "Push mail alerts via ServerChan (方糖)"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-serverchan = "mailflow_notify_serverchan.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_serverchan"]
