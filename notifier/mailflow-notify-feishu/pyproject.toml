[project]
name = "mailflow-notify-feishu"
version = "0.1.0"
description = "Push mail alerts to a Feishu custom-bot webhook"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-feishu = "mailflow_notify_feishu.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_feishu"]
